<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceGuard – Hệ thống giám định giọng nói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  /* Phong cách theo CRM của doanh nghiệp: Roboto, xanh navy chủ đạo, cam cho hành động, nền xám nhạt, bảng kẻ mảnh. */
  :root {
    --navy:#223671; --navy-2:#2f4a96; --navy-soft:#e9edf7; --orange:#f26526; --orange-2:#d9531a;
    --bg:#f5f6fc; --card:#ffffff; --fg:#212529; --th:#495057; --muted:#6c757d; --line:#e9ecef; --grid:#dee2e6; --soft:#f8f9fa;
    --ok:#198754; --ok-bg:#e8f5ee; --warn:#b26a00; --warn-bg:#fff4e0; --bad:#d63031; --bad-bg:#fdecec; --none:#adb5bd;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow-x:hidden; }
  body { font:14px/1.5 Roboto, Arial, sans-serif; display:flex; }
  button, input, select, textarea { font:inherit; color:inherit; }
  nav { width:220px; flex:none; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  nav .brand { color:var(--navy); font-weight:700; font-size:18px; line-height:1.3; padding:16px 14px 18px; letter-spacing:.2px; }
  nav .brand small { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0; }
  nav a { display:flex; align-items:center; gap:10px; color:var(--fg); text-decoration:none; padding:9px 14px; font-size:15px; }
  nav a svg { flex:none; color:var(--th); }
  nav a:hover { background:var(--navy-soft); }
  nav a.on { background:var(--navy); color:#fff; } nav a.on svg { color:#fff; }
  nav a .badge { margin-left:auto; background:var(--orange); color:#fff; border-radius:10px; font-size:12px; padding:0 7px; font-weight:700; line-height:18px; }
  nav .foot { margin-top:auto; font-size:12px; color:var(--muted); padding:12px 14px; border-top:1px solid var(--line); }
  nav .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  nav .dot.off { background:var(--bad); }
  .shell { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { height:56px; flex:none; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:0 20px; }
  .topbar h1 { font-size:18px; font-weight:500; color:var(--navy); margin:0; }
  .topbar .grow { flex:1; }
  .topbar .clock { color:var(--muted); font-variant-numeric:tabular-nums; }
  .user { display:flex; align-items:center; gap:10px; padding-left:14px; margin-left:4px; border-left:1px solid var(--line); }
  .user .av { width:32px; height:32px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; }
  .user .who { line-height:1.2; } .user .who b { display:block; font-weight:500; } .user .who small { color:var(--muted); font-size:12px; }
  .logout { border:1px solid var(--line); background:#fff; border-radius:4px; width:34px; height:34px; display:grid; place-items:center; cursor:pointer; color:var(--th); }
  .logout:hover { border-color:var(--orange); color:var(--orange); }
  main { flex:1; min-width:0; overflow:auto; padding:16px 20px 32px; }
  .toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar .grow { flex:1; }
  .iconbtn { width:36px; height:36px; border:0; border-radius:4px; background:var(--orange); color:#fff; display:grid; place-items:center; cursor:pointer; }
  .iconbtn:hover { background:var(--orange-2); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .empty { color:var(--muted); padding:28px; text-align:center; }
  .count { color:var(--muted); }
  /* bảng */
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { text-align:left; padding:4px 10px; height:40px; vertical-align:middle; border-bottom:1px solid var(--line); }
  th + th, td + td { border-left:1px solid var(--grid); }
  th { color:var(--th); font-weight:700; font-size:14px; white-space:nowrap; height:36px; border-bottom:1px solid var(--grid); }
  td { font-size:13px; }
  td.num { white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--navy-soft); }
  tr.HIGH td:first-child { box-shadow:inset 3px 0 0 var(--bad); } tr.MEDIUM td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
  tr.HIGH td { background:#fff7f7; }
  tr.flash td { animation:flash 1.2s ease-out 2; }
  @keyframes flash { 0% { background:#ffd9d9; } 100% { background:#fff7f7; } }
  .lvl { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:2px 8px; border-radius:4px; background:var(--soft); color:var(--muted); white-space:nowrap; }
  .lvl.HIGH { background:var(--bad-bg); color:var(--bad); } .lvl.MEDIUM { background:var(--warn-bg); color:var(--warn); } .lvl.LOW { background:var(--ok-bg); color:var(--ok); }
  .chip { font-size:12px; padding:1px 6px; border-radius:4px; background:var(--soft); color:var(--muted); white-space:nowrap; border:1px solid var(--line); }
  .chip.blacklist { background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  .chip.unknown, .chip.hidden { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  .chip.act { background:var(--navy-soft); color:var(--navy); border-color:transparent; }
  .pctcell { font-weight:700; font-variant-numeric:tabular-nums; }
  .pctcell.HIGH { color:var(--bad); } .pctcell.MEDIUM { color:var(--warn); }
  svg.spark { width:160px; height:28px; display:block; }
  .drawer svg.spark { width:100%; height:44px; }
  .section { margin-top:20px; }
  .section h2 { font-size:15px; font-weight:500; color:var(--navy); margin:0 0 8px; }
  .tabs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .tabs button { border:0; background:none; padding:7px 14px; cursor:pointer; color:var(--fg); }
  .tabs button + button { border-left:1px solid var(--line); }
  .tabs button.on { background:var(--navy); color:#fff; }
  .btn { border:1px solid var(--line); background:#fff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .btn:hover { border-color:var(--navy); color:var(--navy); }
  .btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.orange { background:var(--orange); color:#fff; border-color:var(--orange); }
  .btn.bad { background:var(--bad); color:#fff; border-color:var(--bad); }
  .btn.good { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btn.sm { padding:3px 10px; font-size:13px; }
  .form { display:flex; gap:8px; flex-wrap:wrap; padding:12px; border-bottom:1px solid var(--line); }
  .form input { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; min-width:200px; }
  .form input:focus, textarea:focus { outline:none; border-color:var(--navy); }
  /* chỉ số */
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .kpi { padding:14px 16px; border-top:3px solid var(--navy); }
  .kpi .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; color:var(--navy); }
  .kpi .l { color:var(--muted); font-size:13px; }
  .kpi.bad { border-top-color:var(--bad); } .kpi.bad .v { color:var(--bad); }
  .kpi.warn { border-top-color:var(--warn); } .kpi.warn .v { color:var(--warn); }
  /* ngăn chi tiết */
  .scrim { position:fixed; inset:0; background:rgba(33,37,41,.35); display:none; z-index:20; }
  .scrim.on { display:block; }
  .drawer { visibility:hidden; position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:#fff; z-index:21; transform:translateX(100%);
            transition:transform .2s ease; overflow:auto; border-left:1px solid var(--line); }
  .drawer.on { transform:none; visibility:visible; }
  .drawer .dh { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:1; }
  .drawer .dh h2 { margin:0; font-size:17px; font-weight:500; flex:1; }
  .drawer .dh .x { border:0; background:none; font-size:22px; cursor:pointer; color:#fff; line-height:1; }
  .drawer .db { padding:16px 18px 24px; }
  .drawer h3 { font-size:14px; font-weight:500; color:var(--navy); margin:18px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .verdict { border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:14px; margin:0 0 4px; }
  .verdict.HIGH { background:var(--bad-bg); color:var(--bad); } .verdict.MEDIUM { background:var(--warn-bg); color:var(--warn); }
  .verdict.LOW { background:var(--ok-bg); color:var(--ok); } .verdict.NONE { background:var(--soft); color:var(--muted); }
  .verdict b { font-size:20px; font-weight:700; display:block; }
  .verdict .p { margin-left:auto; font-size:30px; font-weight:700; line-height:1; text-align:right; }
  .verdict p { margin:0; color:var(--fg); font-size:13px; }
  .segs { position:relative; height:28px; background:var(--soft); border:1px solid var(--line); border-radius:4px; margin:8px 0 4px; }
  .segs button { position:absolute; top:3px; bottom:3px; border:0; border-radius:2px; cursor:pointer; padding:0; }
  .segs button.HIGH { background:var(--bad); } .segs button.MEDIUM { background:var(--warn); } .segs button.LOW { background:var(--ok); opacity:.5; }
  .segs button:hover { outline:2px solid var(--navy); }
  .segs .ph { position:absolute; top:0; bottom:0; width:2px; background:var(--navy); pointer-events:none; }
  .ticks { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .suspects { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; margin:0; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  textarea { width:100%; min-height:56px; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:8px; }
  .note { font-size:12px; color:var(--muted); }
  audio { width:100%; height:36px; }
  /* thông báo */
  .toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:30; }
  .toast { background:#fff; border:1px solid var(--line); border-left:4px solid var(--bad); color:var(--fg); padding:10px 14px; border-radius:6px;
           box-shadow:0 6px 18px rgba(33,37,41,.12); cursor:pointer; max-width:340px; }
  .toast b { display:block; color:var(--bad); }
  @media (max-width:760px) { body { flex-direction:column; } nav { width:auto; flex-direction:row; overflow:auto; border-right:0; border-bottom:1px solid var(--line); }
    nav .brand, nav .foot { display:none; } nav a span:not(.badge) { white-space:nowrap; } main { padding:12px; } }
</style>
</head>
<body>
<nav>
  <div class="brand">VOICEGUARD<small>Hệ thống giám định giọng nói</small></div>
  <a href="#live" data-v="live"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg><span>Cuộc gọi đang diễn ra</span><span class="badge" id="liveBadge" hidden></span></a>
  <a href="#review" data-v="review"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Chờ xác minh</span><span class="badge" id="reviewBadge" hidden></span></a>
  <a href="#numbers" data-v="numbers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Quản lý số điện thoại</span></a>
  <a href="#overview" data-v="overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10m6 10V4m6 16v-7m6 7H2"/></svg><span>Báo cáo tổng quan</span></a>
  <a href="#check" data-v="check"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>Phân tích file âm thanh</span></a>
  <div class="foot"><span class="dot off" id="conn"></span><span id="connText">Đang kết nối...</span><div id="modelInfo"></div></div>
</nav>
<div class="shell">
  <header class="topbar"><h1 id="title"></h1><div class="grow"></div><span class="clock" id="clock"></span>
    <div class="user"><div class="av" id="av"></div><div class="who"><b id="uname"></b><small id="ulogin"></small></div>
      <button class="logout" id="logout" title="Đăng xuất" aria-label="Đăng xuất"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 17l5-5-5-5M20 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></button></div></header>
  <main id="view"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div class="toasts" id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEVEL = {HIGH:{w:"Rủi ro cao"}, MEDIUM:{w:"Cần xác minh"}, LOW:{w:"An toàn"}};
const TITLES = {live:"Cuộc gọi đang diễn ra", review:"Danh sách chờ xác minh", numbers:"Quản lý số điện thoại", overview:"Báo cáo tổng quan", check:"Phân tích file âm thanh"};
const DOT = '<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>';
const ICON = {refresh:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
              download:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'};
const CAT = {registered:"Số đã định danh", unknown:"Số lạ / Chưa đăng ký", hidden:"Thuê bao ẩn số", blacklist:"Danh sách đen (Blacklist)", not_provided:"Không xác định số"};
const CH = {none:"File thu gốc", opus12:"Zalo, Messenger (Opus)", amrnb:"Di động 3G, 4G (AMR-NB)", amrwb:"VoLTE / HD Voice", g711u:"Tổng đài cố định (G.711u)", g711a:"Tổng đài cố định (G.711a)",
            gsm:"Di động 2G (GSM)", g722:"Tổng đài IP (G.722)", mp3_32:"Tin nhắn thoại (MP3)", nb8k:"Băng hẹp 8 kHz"};
const ACT = {continue:"Đã xác minh · Cho phép tiếp tục", verify:"Yêu cầu xác thực bổ sung", hold:"Tạm dừng giao dịch", transfer:"Chuyển phòng chống gian lận"};
const ADVICE = {HIGH:"Tạm dừng giao dịch, chuyển phòng chống gian lận", MEDIUM:"Xác minh danh tính trước khi duyệt tác vụ nhạy cảm", LOW:"Cho phép tiếp tục giao dịch bình thường"};
let active = new Map(), recent = [], view = "live", health = null, audioCtx = null;

// ---------- helpers ----------
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? `${s | 0} giây trước` : s < 3600 ? `${s / 60 | 0} phút trước` : `${s / 3600 | 0} giờ trước`; };
const clock = t => { if (!t) return "–"; const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())} ${p(d.getDate())}/${p(d.getMonth() + 1)}`; };
const dur = s => s == null ? "–" : `${(s / 60) | 0}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const lvlTag = l => l ? `<span class="lvl ${l}">${DOT}${LEVEL[l].w}</span>` : `<span class="lvl">Đang phân tích...</span>`;
const pct = c => c.spoof_percent == null ? "" : `${Math.round(c.spoof_percent)}%<small>nguy cơ giả mạo</small>`;
async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 401) { location.replace("/login"); throw new Error("Phiên đăng nhập đã hết hạn"); }
  const d = await r.json(); if (!r.ok) throw new Error(d.detail || r.statusText); return d;
}
let me = null;
const post = (path, data) => api(path, {method:"POST", body:new URLSearchParams(data)});

function spark(wins, p) {
  if (!wins?.length) return `<svg class="spark"></svg>`;
  const W = 260, H = 38, sc = wins.map(w => w.score), lo = Math.min(...sc, p?.t_high ?? -10) - 1, hi = Math.max(...sc, p?.t_medium ?? 0) + 1;
  const x = i => wins.length === 1 ? W / 2 : 4 + i / (wins.length - 1) * (W - 8), y = v => 3 + (hi - v) / (hi - lo) * (H - 6);
  const col = l => `var(--${l === "HIGH" ? "bad" : l === "MEDIUM" ? "warn" : "ok"})`;
  const line = p ? `<line x1="0" x2="${W}" y1="${y(p.t_medium)}" y2="${y(p.t_medium)}" stroke="var(--warn)" stroke-dasharray="3 3" stroke-width="1"/>
                    <line x1="0" x2="${W}" y1="${y(p.t_high)}" y2="${y(p.t_high)}" stroke="var(--bad)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Điểm theo thời gian">${line}
    <polyline points="${wins.map((w, i) => `${x(i)},${y(w.score)}`).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    ${wins.map((w, i) => `<circle cx="${x(i)}" cy="${y(w.score)}" r="3" style="fill:${col(w.level)}"/>`).join("")}</svg>`;
}

function beep() {
  try {
    audioCtx = audioCtx || new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.5);
  } catch {}
}
function toast(c) {
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<b>Cảnh báo nguy cơ cao</b>${esc(c.caller_masked)} · ${esc(CH[c.channel] || c.channel)}${c.spoof_percent != null ? ` · ${Math.round(c.spoof_percent)}% nguy cơ giả mạo` : " · Thuê bao thuộc Blacklist"}`;
  t.onclick = () => { openCall(c.id); t.remove(); };
  $("toasts").append(t); setTimeout(() => t.remove(), 9000); beep();
}

// ---------- events ----------
function connect() {
  const es = new EventSource("/v1/events");
  es.onopen = () => { $("conn").classList.remove("off"); $("connText").textContent = "Đã kết nối"; };
  es.onerror = () => { $("conn").classList.add("off"); $("connText").textContent = "Mất kết nối máy chủ"; };
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "call_started") active.set(ev.call.id, {...ev.call, windows:[]});
    else if (ev.type === "call_update") {
      const c = active.get(ev.call_id); if (!c) return;
      Object.assign(c, {score:ev.score, spoof_percent:ev.spoof_percent, risk_level:ev.risk_level, max_level:ev.max_level,
                        n_windows:ev.n_windows, duration_s:ev.audio_s});
      c.windows = (c.windows || []).concat(ev.windows);
    } else if (ev.type === "alert") {
      const c = active.get(ev.call.id); if (c) { Object.assign(c, ev.call, {windows:c.windows}); c.flash = true; }
      toast(ev.call);
    } else if (ev.type === "call_ended") {
      active.delete(ev.call.id); recent.unshift(ev.call); recent = recent.slice(0, 12);
    } else if (ev.type === "action" || ev.type === "verdict") {
      const c = active.get(ev.call.id); if (c) Object.assign(c, {action:ev.call.action, verdict:ev.call.verdict});
      const i = recent.findIndex(r => r.id === ev.call.id); if (i >= 0) recent[i] = ev.call;
    }
    if (drawerId && (ev.call?.id === drawerId || ev.call_id === drawerId)) refreshDrawer();
    scheduleRender(ev.type);
  };
}
let pending = null;
function scheduleRender(type) {
  if (pending) return;
  pending = setTimeout(() => { pending = null;
    if (view === "live") renderLive();
    else if ((view === "review" && ["call_ended", "verdict", "action", "alert"].includes(type)) ||
             (view === "numbers" && type === "numbers") || view === "overview") render();
    badges();
  }, 250);
}
async function badges() {
  const hi = [...active.values()].filter(c => c.risk_level === "HIGH").length;
  $("liveBadge").hidden = !hi; $("liveBadge").textContent = hi;
  try { const q = await api("/v1/calls?min_level=MEDIUM&unreviewed=true&status=ended&limit=500"); $("reviewBadge").hidden = !q.length; $("reviewBadge").textContent = q.length; } catch {}
}

// ---------- views ----------
function setView() {
  view = (location.hash || "#live").slice(1);
  if (!TITLES[view]) view = "live";
  document.querySelectorAll("nav a[data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  $("title").textContent = TITLES[view];
  render();
}
window.addEventListener("hashchange", setView);
function render() { ({live:renderLive, review:renderReview, numbers:renderNumbers, overview:renderOverview, check:renderCheck}[view])(); }
const tool = (left, right = "") => `<div class="toolbar">${left}<div class="grow"></div>${right}</div>`;
const refreshBtn = `<button class="iconbtn" id="refresh" title="Làm mới">${ICON.refresh}</button>`;
function bindRefresh() { const b = $("refresh"); if (b) b.onclick = render; }

function renderCheck() {
  if ($("checkFrame")) return;                                              // keep the tool's state across events
  $("view").innerHTML = `<iframe id="checkFrame" src="/check?embed=1" title="Kiểm tra tệp" style="width:100%;border:0;display:block;height:700px"></iframe>`;
  const f = $("checkFrame");
  // Height of the tool's own content, not of the frame's viewport, so the frame can shrink as well as grow.
  const fit = () => { try { f.style.height = Math.ceil(f.contentDocument.querySelector(".wrap").getBoundingClientRect().height) + 4 + "px"; } catch {} };
  f.onload = () => { fit(); new ResizeObserver(fit).observe(f.contentDocument.querySelector(".wrap")); };
}

function renderLive() {
  const order = {HIGH:0, MEDIUM:1, LOW:2};
  const calls = [...active.values()].sort((a, b) => (order[a.risk_level] ?? 3) - (order[b.risk_level] ?? 3) || a.started_at - b.started_at);
  const hi = calls.filter(c => c.risk_level === "HIGH").length, me = calls.filter(c => c.risk_level === "MEDIUM").length;
  $("view").innerHTML = `
    ${tool(`<span class="count">${calls.length} cuộc gọi đang diễn ra${hi ? ` · <b style="color:var(--bad)">${hi} rủi ro cao</b>` : ""}${me ? ` · <b style="color:var(--warn)">${me} cần xác minh</b>` : ""}</span>`)}
    <div class="card"><div class="tablewrap"><table><thead><tr><th>Số gọi đến</th><th>Trạng thái số</th><th>Kênh cuộc gọi</th><th>Thời lượng</th><th>Biểu đồ rủi ro</th><th>Tỷ lệ giả mạo</th><th>Mức cảnh báo</th><th>Thao tác</th></tr></thead><tbody>
      ${calls.map(c => `<tr class="click ${c.risk_level || ""} ${c.flash ? "flash" : ""}" data-id="${c.id}">
        <td class="num"><b>${esc(c.caller_masked)}</b></td><td><span class="chip ${c.category}">${CAT[c.category] || c.category}</span></td>
        <td>${esc(CH[c.channel] || c.channel)}</td><td class="num">${dur(c.duration_s)}</td><td>${spark(c.windows, c.policy)}</td>
        <td class="num pctcell ${c.risk_level || ""}">${c.spoof_percent == null ? (c.screened_by === "prefilter" ? "chặn do Blacklist" : "–") : Math.round(c.spoof_percent) + "%"}</td>
        <td>${lvlTag(c.risk_level)}</td><td>${c.action ? `<span class="chip act">${ACT[c.action]}</span>` : "–"}</td></tr>`).join("")
        || `<tr><td colspan="8" class="empty">Hiện không có cuộc gọi nào đang hoạt động</td></tr>`}
    </tbody></table></div></div>
    <div class="section"><h2>Cuộc gọi vừa kết thúc</h2><div class="card">${callTable(recent, false)}</div></div>`;
  calls.forEach(c => c.flash = false);
  bindRows();
}
function callTable(rows, review) {
  return `<div class="tablewrap"><table><thead><tr><th>Thời gian</th><th>Số gọi đến</th><th>Trạng thái số</th><th>Kênh cuộc gọi</th><th>Thời lượng</th><th>Rủi ro cao nhất</th><th>Tỷ lệ giả mạo</th><th>Thao tác</th>${review ? "<th>Kết luận xác minh</th>" : ""}</tr></thead><tbody>
    ${rows.map(c => `<tr class="click" data-id="${c.id}"><td class="num">${clock(c.started_at)}</td><td class="num">${esc(c.caller_masked)}</td>
      <td><span class="chip ${c.category}">${CAT[c.category] || ""}</span></td><td>${esc(CH[c.channel] || c.channel)}</td><td class="num">${dur(c.duration_s)}</td>
      <td>${lvlTag(c.max_level)}</td><td class="num pctcell ${c.max_level || ""}">${c.spoof_percent == null ? (c.screened_by === "prefilter" ? "chặn do Blacklist" : "–") : Math.round(c.spoof_percent) + "%"}</td>
      <td>${c.action ? ACT[c.action] : "–"}</td>${review ? `<td>${c.verdict === "fraud" ? '<span class="lvl HIGH">Gian lận / Giả mạo</span>' : c.verdict === "genuine" ? '<span class="lvl LOW">Khách chính chủ</span>' : '<span class="lvl MEDIUM">Chờ xác minh</span>'}</td>` : ""}</tr>`).join("")
      || `<tr><td colspan="${review ? 9 : 8}" class="empty">Không có dữ liệu cuộc gọi</td></tr>`}
  </tbody></table></div>`;
}
function bindRows() { document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => openCall(el.dataset.id)); }

let reviewAll = false;
async function renderReview() {
  const rows = await api(`/v1/calls?min_level=MEDIUM&status=ended&limit=300${reviewAll ? "" : "&unreviewed=true"}`);
  $("view").innerHTML = `
    ${tool(`<div class="tabs"><button class="${reviewAll ? "" : "on"}" id="rq1">Chờ xác minh</button><button class="${reviewAll ? "on" : ""}" id="rq2">Tất cả hồ sơ</button></div>`, refreshBtn)}
    <div class="card">${callTable(rows, true)}</div>`;
  $("rq1").onclick = () => { reviewAll = false; renderReview(); };
  $("rq2").onclick = () => { reviewAll = true; renderReview(); };
  bindRows(); bindRefresh();
}

let numTab = "blacklist";
async function renderNumbers() {
  const rows = await api(`/v1/numbers?list=${numTab}`);
  const tab = (k, t) => `<button class="${numTab === k ? "on" : ""}" data-t="${k}">${t}</button>`;
  $("view").innerHTML = `
    ${tool(`<div class="tabs">${tab("blacklist", "Danh sách đen (Blacklist)")}${tab("registered", "Số đã định danh")}${tab("suggested", "Đề xuất chặn")}</div>`, refreshBtn)}
    <div class="card">
      ${numTab !== "suggested" ? `<form class="form" id="addForm"><input name="number" placeholder="Nhập số điện thoại" required inputmode="tel">
        <input name="note" placeholder="Nhập ghi chú lý do..."><button class="btn orange">Thêm số</button></form>` : ""}
      <div class="tablewrap"><table><thead><tr><th>Số điện thoại</th>${numTab === "suggested" ? "<th>Số lần cảnh báo</th><th>Gian lận / Chính chủ</th>" : "<th>Nguồn tạo</th><th>Ghi chú</th><th>Ngày thêm</th><th>Tổng cuộc gọi</th>"}<th>Cuộc gọi gần nhất</th><th>Thao tác</th></tr></thead><tbody>
        ${rows.map(n => `<tr><td class="num">${esc(n.masked)}</td>${numTab === "suggested" ? `<td class="num">${n.high_calls}</td><td class="num">${n.fraud || 0} / ${n.genuine || 0}</td>` :
          `<td>${esc(n.source)}</td><td>${esc(n.note) || "–"}</td><td class="num">${clock(n.added_at)}</td><td class="num">${n.calls}</td>`}
          <td class="num">${n.last_call ? clock(n.last_call) : "–"}</td>
          <td>${numTab === "suggested" ? `<button class="btn sm bad" data-add="${n.key}">Chặn số</button>` : `<button class="btn sm" data-del="${n.key}">Gỡ bỏ</button>`}</td></tr>`).join("")
          || `<tr><td colspan="7" class="empty">Không có dữ liệu</td></tr>`}
      </tbody></table></div>
    </div>`;
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { numTab = b.dataset.t; renderNumbers(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await api(`/v1/numbers/${b.dataset.del}?list=${numTab}`, {method:"DELETE"}); renderNumbers(); });
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => { await post("/v1/numbers", {key:b.dataset.add, list:"blacklist", note:"Duyệt từ danh sách đề xuất"}); renderNumbers(); });
  const f = $("addForm");
  if (f) f.onsubmit = async e => { e.preventDefault(); try { await post("/v1/numbers", {...Object.fromEntries(new FormData(f)), list:numTab}); renderNumbers(); } catch (err) { alert(err.message); } };
  bindRefresh();
}

async function renderOverview() {
  const s = await api("/v1/stats?hours=24");
  const fa = s.genuine + s.fraud ? Math.round(100 * s.false_alarm / Math.max(1, s.false_alarm + s.fraud)) : null;
  const k = (v, l, cls = "") => `<div class="card kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const maxH = Math.max(1, ...s.by_hour.map(h => h.n));
  const bars = Array.from({length:24}, (_, i) => s.by_hour.find(h => h.h === i) || {h:i, n:0, high:0, medium:0});
  $("view").innerHTML = `
    ${tool(`<span class="count">Thống kê 24 giờ qua</span>`, refreshBtn)}
    <div class="kpis">
      ${k(s.total, "Tổng cuộc gọi")}${k(s.open_calls, "Đang kết nối")}${k(s.high, "Rủi ro cao", "bad")}${k(s.medium, "Cần xác minh", "warn")}
      ${k(s.blocked, "Chặn do Blacklist", "bad")}${k(s.pending, "Chờ xác minh", "warn")}${k(s.fraud, "Xác nhận gian lận", "bad")}
      ${k(fa == null ? "–" : fa + "%", "Báo động nhầm (False Alarm)")}${k(s.latency_p95_ms == null ? "–" : Math.round(s.latency_p95_ms) + " ms", "Độ trễ xử lý (P95)")}
      ${k(s.held, "Giao dịch đã tạm giữ")}
    </div>
    <div class="section"><h2>Lưu lượng cuộc gọi theo từng giờ</h2><div class="card" style="padding:14px 16px">
      <svg viewBox="0 0 720 160" width="100%" role="img" aria-label="Số cuộc gọi theo giờ">
        ${bars.map((b, i) => { const x = 10 + i * 29, h = 120 * b.n / maxH, hh = 120 * b.high / maxH, hm = 120 * b.medium / maxH;
          return `<g><title>${i}h: ${b.n} cuộc gọi (${b.high} rủi ro cao, ${b.medium} cần xác minh)</title>
            <rect x="${x}" y="${130 - h}" width="22" height="${h}" rx="2" style="fill:var(--navy-soft)"/>
            <rect x="${x}" y="${130 - hh - hm}" width="22" height="${hm}" style="fill:var(--warn)"/>
            <rect x="${x}" y="${130 - hh}" width="22" height="${hh}" style="fill:var(--bad)"/>
            ${i % 3 === 0 ? `<text x="${x + 11}" y="150" text-anchor="middle" style="fill:var(--muted);font-size:11px">${i}h</text>` : ""}</g>`; }).join("")}
      </svg>
      <div class="note" style="display:flex;gap:14px"><span style="color:var(--navy)">${DOT} An toàn</span><span style="color:var(--warn)">${DOT} Cần xác minh</span><span style="color:var(--bad)">${DOT} Rủi ro cao</span></div></div></div>
    <div class="section"><h2>Cuộc gọi rủi ro cao gần nhất</h2><div class="card">${callTable(await api("/v1/calls?min_level=HIGH&limit=10"), true)}</div></div>`;
  bindRows(); bindRefresh();
}

// ---------- drawer: one call ----------
let drawerId = null;
async function openCall(id) { drawerId = id; $("scrim").classList.add("on"); $("drawer").classList.add("on"); await refreshDrawer(); }
function closeDrawer() { $("recAudio")?.pause(); drawerId = null; $("scrim").classList.remove("on"); $("drawer").classList.remove("on"); }
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
async function refreshDrawer() {
  if (!drawerId) return;
  const c = await api(`/v1/calls/${drawerId}`), live = c.status === "active", l = c.risk_level || "NONE";
  const blocked = c.screened_by === "prefilter";
  $("drawer").innerHTML = `<div class="dh"><h2>${esc(c.caller_masked)}</h2><button class="x" aria-label="Đóng">×</button></div><div class="db">
    <dl class="kv" style="margin-bottom:12px">
      <dt>Trạng thái số</dt><dd>${CAT[c.category] || ""}</dd><dt>Kênh cuộc gọi</dt><dd>${esc(CH[c.channel] || c.channel)}</dd>
      <dt>Thời gian gọi</dt><dd>${clock(c.started_at)} · ${live ? "Đang đàm thoại" : "Đã kết thúc"} · ${dur(c.duration_s)}</dd>
    </dl>
    <div class="verdict ${l}"><div><b>${blocked ? "Chặn do Blacklist" : c.risk_level ? LEVEL[c.risk_level].w : "Đang phân tích..."}</b>
      ${c.risk_level && !blocked ? `<p>${ADVICE[c.risk_level]}</p>` : ""}</div>
      ${c.spoof_percent != null ? `<div class="p">${Math.round(c.spoof_percent)}%<small style="display:block;font-size:12px;font-weight:500;white-space:nowrap">nguy cơ giả mạo</small></div>` : ""}</div>
    ${c.windows.length ? `<h3>Biến thiên rủi ro theo thời gian</h3>${spark(c.windows, c.policy)}` : ""}
    <h3>Bản ghi âm cuộc gọi</h3>
    ${c.recording ? playerHtml(c) : `<p class="note">${live ? "File ghi âm sẵn sàng sau khi kết thúc cuộc gọi" : "Không có bản ghi"}</p>`}
    <h3>Thao tác xử lý</h3>
    <div class="acts">
      <button class="btn ${c.action === "continue" ? "primary" : ""}" data-act="continue">Đã xác minh · Cho phép tiếp tục</button>
      <button class="btn ${c.action === "verify" ? "primary" : ""}" data-act="verify">Yêu cầu xác thực bổ sung</button>
      <button class="btn ${c.action === "hold" ? "primary" : ""}" data-act="hold">Tạm dừng giao dịch</button>
      <button class="btn ${c.action === "transfer" ? "primary" : ""}" data-act="transfer">Chuyển phòng chống gian lận</button>
    </div>
    <h3>Kết luận xác minh</h3>
    ${c.verdict ? `<p style="margin:0 0 8px">${c.verdict === "fraud" ? '<span class="lvl HIGH">Gian lận / Giả mạo</span>' : '<span class="lvl LOW">Khách chính chủ</span>'} ${c.verdict_note ? esc(c.verdict_note) : ""}</p>` : ""}
    <textarea id="vnote" placeholder="Nhập ghi chú hoặc lý do xác minh...">${esc(c.verdict_note || "")}</textarea>
    <div class="acts"><button class="btn bad" data-ver="fraud">Xác nhận gian lận & Chặn số</button><button class="btn good" data-ver="genuine">Xác nhận chính chủ</button></div>
    <h3>Thông tin chi tiết</h3>
    <dl class="kv">
      <dt>Lịch sử thuê bao</dt><dd>${c.caller_history.calls} cuộc gọi (${c.caller_history.high} lần cảnh báo)</dd>
      <dt>Phân loại danh sách</dt><dd>${c.caller_lists.length ? c.caller_lists.map(x => x === "blacklist" ? "Danh sách đen" : "Số đã định danh").join(", ") : "–"}</dd>
      <dt>Mã file ghi âm (Call ID)</dt><dd>${esc(c.recording_ref) || "–"}</dd>
      <dt>Điểm tin cậy (Score)</dt><dd>${c.score == null ? "–" : c.score.toFixed(2)} (ngưỡng kiểm tra: ${c.policy.t_medium.toFixed(2)} / ${c.policy.t_high.toFixed(2)})</dd>
      <dt>Mã phiên cuộc gọi</dt><dd>${c.id}</dd>
    </dl></div>`;
  $("drawer").querySelector(".x").onclick = closeDrawer;
  if (c.recording) bindPlayer(c);
  $("drawer").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => { await post(`/v1/calls/${c.id}/action`, {action:b.dataset.act}); refreshDrawer(); });
  $("drawer").querySelectorAll("[data-ver]").forEach(b => b.onclick = async () => {
    await post(`/v1/calls/${c.id}/verdict`, {verdict:b.dataset.ver, note:$("vnote").value}); refreshDrawer(); if (view !== "live") render(); });
}

// ---------- playback ----------
function playerHtml(c) {
  const total = Math.max(c.duration_s || 0, ...c.windows.map(w => w.end), 1);
  const hop = c.windows.length > 1 ? c.windows[1].start - c.windows[0].start : 4;
  const suspects = c.windows.filter(w => w.level !== "LOW").sort((a, b) => a.score - b.score).slice(0, 6);
  return `<audio id="recAudio" controls preload="metadata" src="/v1/calls/${c.id}/recording" style="width:100%"></audio>
    <div class="segs" id="segs">${c.windows.map(w => `<button class="${w.level}" data-s="${w.start}" data-e="${w.end}"
        style="left:${100 * w.start / total}%;width:calc(${100 * Math.min(hop, w.end - w.start) / total}% - 2px)"
        title="${w.start.toFixed(0)}–${w.end.toFixed(0)} s: ${LEVEL[w.level].w}"></button>`).join("")}<div class="ph" id="ph"></div></div>
    <div class="ticks"><span>0 s</span><span>${(total / 2).toFixed(0)} s</span><span>${total.toFixed(0)} s</span></div>
    ${suspects.length ? `<div class="suspects">${suspects.map(w => `<button class="btn sm" data-s="${w.start}" data-e="${w.end}">▶ ${w.start.toFixed(0)}–${w.end.toFixed(0)} s</button>`).join("")}</div>`
                      : ""}`;
}
function bindPlayer(c) {
  const a = $("recAudio"), total = Math.max(c.duration_s || 0, ...c.windows.map(w => w.end), 1);
  let stopAt = null;
  a.ontimeupdate = () => { $("ph").style.left = `${100 * a.currentTime / total}%`; if (stopAt !== null && a.currentTime >= stopAt) { a.pause(); stopAt = null; } };
  $("drawer").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { a.currentTime = +b.dataset.s; stopAt = +b.dataset.e; a.play(); });
}

// ---------- start ----------
(async () => {
  try {
    me = await api("/v1/auth/me");
    $("uname").textContent = me.full_name || me.username; $("ulogin").textContent = me.username;
    $("av").textContent = (me.full_name || me.username).trim().split(/\s+/).slice(-1)[0][0].toUpperCase();
    $("logout").onclick = async () => { await fetch("/v1/auth/logout", {method:"POST"}); location.replace("/login"); };
    health = await api("/health");
    if (!health.model?.random_weights) $("modelInfo").textContent = `Mô hình ${health.model?.num_layers ?? ""} lớp · ${health.device.toUpperCase()}`;
    const live = await api("/v1/calls?status=active&limit=500");
    for (const c of live) { const d = await api(`/v1/calls/${c.id}`); active.set(c.id, d); }
    recent = await api("/v1/calls?status=ended&limit=12");
  } catch {}
  const tick = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); $("clock").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`; };
  tick(); setInterval(tick, 1000);
  connect(); setView(); badges();
  setInterval(() => { if (view === "live") renderLive(); }, 1000);
})();
</script>
</body>
</html>
