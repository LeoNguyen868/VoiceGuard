<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceGuard – Đăng nhập</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  :root { --navy:#223671; --navy-d:#16224d; --navy-l:#2f4a96; --orange:#f26526; --orange-d:#d9531a; --fg:#212529; --muted:#6c757d; --line:#dee2e6; --bad:#d63031; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:14px/1.5 Roboto, Arial, sans-serif; color:var(--fg); display:flex; background:#fff; }
  .brand { flex:1; background:linear-gradient(160deg, var(--navy-d) 0%, var(--navy) 45%, var(--navy-l) 100%); color:#fff;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:32px; position:relative; overflow:hidden; }
  .brand::after { content:""; position:absolute; inset:auto -120px -160px auto; width:420px; height:420px; border-radius:50%;
                  border:60px solid rgba(255,255,255,.04); }
  .brand .mark { display:flex; align-items:center; gap:18px; }
  .brand .mark b { font-size:64px; font-weight:900; letter-spacing:2px; line-height:1; }
  .brand .pill { background:var(--orange); padding:8px 28px; border-radius:4px; font-weight:700; letter-spacing:5px; font-size:18px; }
  .brand p { margin:0; opacity:.85; }
  .form-side { flex:1; display:flex; align-items:center; justify-content:center; padding:32px; }
  .box { width:min(420px, 100%); text-align:center; }
  .box h1 { margin:0; color:var(--navy); font-size:26px; font-weight:700; }
  .box .bar { width:96px; height:4px; background:var(--orange); border-radius:2px; margin:10px auto 14px; }
  .box .sub { color:var(--muted); margin:0 0 22px; }
  form { border:1px solid var(--line); border-radius:8px; padding:24px; text-align:left; box-shadow:0 2px 10px rgba(33,37,41,.06); }
  .field { position:relative; margin-bottom:14px; }
  .field svg.ic { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .field input { width:100%; padding:11px 40px 11px 38px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:15px; }
  .field input:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(34,54,113,.12); }
  .eye { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--muted); cursor:pointer; padding:6px; }
  button.go { width:100%; padding:12px; border:0; border-radius:6px; background:var(--navy); color:#fff; font:inherit; font-weight:700; font-size:15px;
              letter-spacing:.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  button.go:hover { background:var(--navy-l); }
  button.go:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--bad); margin:0 0 12px; font-size:13px; }
  .err:empty { display:none; }
  .foot { color:var(--muted); font-size:12px; margin-top:18px; }
  @media (max-width:860px) { body { flex-direction:column; } .brand { flex:none; padding:40px 16px; } .brand .mark b { font-size:44px; } .brand .pill { font-size:14px; letter-spacing:3px; } }
</style>
</head>
<body>
<section class="brand" aria-hidden="true">
  <div class="mark">
    <svg width="64" height="64" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="#fff"/><path d="M8 12h1m2-3v6m2-4v2m2-3v4" stroke="#223671" stroke-width="1.8" stroke-linecap="round"/></svg>
    <b>VoiceGuard</b>
  </div>
  <div class="pill">GIÁM ĐỊNH GIỌNG NÓI</div>
  <p>Phát hiện giọng nói nhân bản trên kênh thoại doanh nghiệp</p>
</section>
<section class="form-side">
  <div class="box">
    <h1>VoiceGuard</h1>
    <div class="bar"></div>
    <p class="sub">Đăng nhập</p>
    <form id="f" novalidate>
      <p class="err" id="err" role="alert"></p>
      <div class="field">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input id="u" name="username" placeholder="Tài khoản" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="p" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="Hiện mật khẩu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="go" id="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>ĐĂNG NHẬP</button>
    </form>
    <p class="foot">VoiceGuard · Hệ thống giám định giọng nói</p>
  </div>
</section>
<script>
const $ = id => document.getElementById(id);
$("eye").onclick = () => { const p = $("p"); p.type = p.type === "password" ? "text" : "password"; $("eye").setAttribute("aria-label", p.type === "password" ? "Hiện mật khẩu" : "Ẩn mật khẩu"); };
$("f").onsubmit = async e => {
  e.preventDefault();
  if (!$("u").value.trim() || !$("p").value) { $("err").textContent = "Nhập tài khoản và mật khẩu"; return; }
  $("go").disabled = true; $("err").textContent = "";
  try {
    const r = await fetch("/v1/auth/login", {method:"POST", body:new URLSearchParams({username:$("u").value, password:$("p").value})});
    if (r.ok) { location.replace("/"); return; }
    const d = await r.json().catch(() => ({}));
    $("err").textContent = d.detail || "Không đăng nhập được";
  } catch { $("err").textContent = "Không kết nối được máy chủ"; }
  $("go").disabled = false; $("p").select();
};
</script>
</body>
</html>
